<!DOCTYPE html>
<html>
<head>
  <title>Simple Login</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #message { margin-top: 10px; font-weight: bold; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Login</h2>

  <form id="loginForm">
    <label>Username:</label>
    <input type="text" id="username" placeholder="Enter username" required><br><br>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter password" required><br><br>

    <label>
      <input type="checkbox" id="rememberMe">
      Remember me
    </label><br><br>

    <button type="submit">Login</button>
  </form>

  <p id="message"></p>

  <script>
    // hard-coded credentials for demo
    const VALID_USER = "admin";
    const VALID_PASS = "1234";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault(); // stop page refresh

      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      const msg = document.getElementById("message");

      // clear old classes
      msg.className = "";

      if (user === "" || pass === "") {
        msg.textContent = "Please enter both username and password.";
        msg.classList.add("error");
        return;
      }

      if (user === VALID_USER && pass === VALID_PASS) {
        msg.textContent = "Login successful!";
        msg.classList.add("success");

        const remember = document.getElementById("rememberMe").checked;
        console.log("Remember me:", remember); // just to show the value in console
      } else {
        msg.textContent = "Invalid username or password";
        msg.classList.add("error");
      }
    });
  </script>
</body>
</html>
